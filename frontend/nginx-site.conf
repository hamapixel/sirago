# Shared directives for each explicitly configured public hostname.
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sirago_backend http://backend:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # React/Swiper and the initial splash use inline CSS; never allow inline JS or eval.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # The company QR reader needs the camera, but no microphone or geolocation.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Strict-Transport-Security $sirago_hsts always;
    add_header Cache-Control $sirago_shell_cache always;

    # Raw Django admin is intentionally not reachable via the public gateway.
    # SiraGo's authenticated /superadmin/ SPA remains available.
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    location ~ ^/(api|static)(/|$) {
        proxy_pass $sirago_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Proto $sirago_scheme;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;
        # Nginx owns the public security headers; do not duplicate Django's values.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_cache off;
    }

    location = /sw.js { try_files $uri =404; }
    location = /registerSW.js { try_files $uri =404; }
    location = /push-events.js { try_files $uri =404; }
    location = /index.html { try_files $uri =404; }
    location = /manifest.webmanifest { try_files $uri =404; }
    # Do not return the React HTML shell for missing crawler files.
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
