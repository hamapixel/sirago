# Only the trusted TLS edge may supply this header. Never publish this port.
map $http_x_forwarded_proto $sirago_scheme {
    default http;
    https https;
}
map $host $sirago_validated_host {
    default "";
    include /etc/nginx/sirago-hosts.map;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    if ($sirago_validated_host = "") { return 400; }
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sirago_backend http://backend:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Raw Django admin is intentionally not reachable via the public gateway.
    # SiraGo's authenticated /superadmin/ SPA remains available.
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    location ~ ^/(api|static)(/|$) {
        proxy_pass $sirago_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $sirago_validated_host;
        proxy_set_header X-Forwarded-Proto $sirago_scheme;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;
        proxy_cache off;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
