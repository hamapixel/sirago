# Only the trusted TLS edge may supply this header. Never publish this port.
map $http_x_forwarded_proto $sirago_scheme {
    default http;
    https https;
}
# Only the app shell and update metadata need mandatory network revalidation.
# Hashed public assets retain their long cache lifetime; API cache policy stays with Django.
map $uri $sirago_shell_cache {
    default "";
    /index.html "no-store";
    /sw.js "no-cache";
    /registerSW.js "no-cache";
    /push-events.js "no-cache";
    /manifest.webmanifest "no-cache";
}
map $sirago_scheme $sirago_hsts {
    default "";
    https "max-age=3600";
}
# Reject requests that do not select an explicitly configured virtual host.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    return 400;
}
include /etc/nginx/sirago-vhosts.conf;
