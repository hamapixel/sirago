# Explicit configuration for the Alpine distribution nginx package.
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Path only: never log query strings, cookies, authorization or request bodies.
    log_format sirago_timing 'GATEWAY_TIMING $uri $status $request_time '
                             '$upstream_connect_time $upstream_header_time $upstream_response_time';
    access_log /dev/stdout sirago_timing;
    # Alpine nginx >= 1.28.3 supports dynamic upstream DNS resolution.
    # Keep a small per-worker idle connection cache; Docker service IPs can change.
    upstream sirago_backend_pool {
        zone sirago_backend_pool 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server backend:8000 resolve;
        keepalive 4;
        keepalive_requests 100;
        # Shorter than Gunicorn's default two-second idle keepalive.
        keepalive_timeout 1s;
    }
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/default.conf;
}
