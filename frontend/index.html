<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#103B38"/><meta name="description" content="SiraGo, réservez votre billet sans vous déplacer."/><link rel="icon" type="image/svg+xml" href="/logo.svg"/><title>SiraGo — Voyagez autrement</title><style>
body{margin:0}
.sirago-splash{box-sizing:border-box;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 38%,#19534b 0%,#103b38 52%,#0a2a28 100%);color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
.sirago-splash-content{display:grid;justify-items:center;gap:12px;width:100%;max-width:420px}
.sirago-splash-logo{display:block;width:clamp(76px,23vw,110px);height:auto;aspect-ratio:1;border-radius:24%;box-shadow:0 12px 38px #061b1a55,0 0 0 1px #ffffff35}
.sirago-splash-name{font-size:clamp(30px,8vw,42px);font-weight:800;line-height:1.15;letter-spacing:-.04em;margin:4px 0 0;color:#fff}
.sirago-splash-tagline{font-size:clamp(13px,3.6vw,16px);font-weight:650;color:#f6b844;margin:0;overflow-wrap:anywhere}
.sirago-splash-loader{display:block;box-sizing:border-box;width:42px;height:42px;border:3px solid #ffffff28;border-top-color:#f6b844;border-right-color:#f6b844;border-radius:50%;margin:12px auto 0;box-shadow:0 0 22px #f6b84438,inset 0 0 14px #f6b84418;animation:sirago-splash-progress .9s linear infinite}
.sirago-inline-loading{display:grid;justify-items:center;align-content:center;gap:12px;min-height:180px;color:#103b38;font-size:.88rem}.sirago-inline-loading .sirago-splash-loader{border-color:#dce6e3;border-top-color:#16836c;border-right-color:#f6b844;box-shadow:0 0 20px #16836c26}
.sirago-splash-status{color:#d3e9e1;font-size:13px;margin:0;line-height:1.5}
.sirago-splash-footer{font-size:12px;color:#d3e9e1;margin:0;padding-top:18px}
.sirago-splash-retry{color:#f6b844;font-size:13px;text-decoration:underline;visibility:hidden;animation:sirago-splash-reveal 0s 15s forwards}
.sirago-splash-retry:focus-visible{outline:2px solid #f6b844;outline-offset:4px}
@keyframes sirago-splash-progress{to{transform:rotate(360deg)}}
@keyframes sirago-splash-reveal{to{visibility:visible}}
@media(prefers-reduced-motion:reduce){.sirago-splash-loader{animation:none}}
</style></head><body><div id="root"><main class="sirago-splash" aria-label="Démarrage de SiraGo"><div class="sirago-splash-content"><svg class="sirago-splash-logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="23" fill="#103B38"/><path d="M23 74 C74 58 76 45 51 38 S38 21 77 17" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M23 74 C74 58 76 45 51 38 S38 21 77 17" stroke="#103B38" stroke-width="2" stroke-dasharray="4 6" fill="none"/><circle cx="23" cy="74" r="9" fill="#F6B844"/></svg><h1 class="sirago-splash-name">SiraGo</h1><p class="sirago-splash-tagline">Ka billet ta fô i sigi yorola.</p><div class="sirago-splash-loader" aria-hidden="true"></div><p class="sirago-splash-status" role="status">Chargement…</p><a class="sirago-splash-retry" href="">Recharger si nécessaire</a><noscript><p>Activez JavaScript pour utiliser SiraGo.</p></noscript></div><p class="sirago-splash-footer">Propulsé par BTDIGIT</p></main></div><script type="module" src="/src/main.tsx"></script></body></html>
