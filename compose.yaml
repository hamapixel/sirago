services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sirago}
      POSTGRES_USER: ${POSTGRES_USER:-sirago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
  saspay-worker:
    profiles: ["saspay"]
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    command: python manage.py reconcile_saspay --watch
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8030:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
  frontend_modules:
