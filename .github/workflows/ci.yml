name: Phase 01 checks
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
        with:
          persist-credentials: false
      - run: sudo chown -R 1000:1000 frontend
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T backend python manage.py check
      - run: docker compose exec -T backend python manage.py test
      - run: docker compose exec -T backend python manage.py makemigrations --check --dry-run
      - run: docker compose exec -T frontend npm test
      - run: docker compose exec -T frontend npm run build
      - if: always()
        run: docker compose logs --tail=100
